# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.parallel=true
# 固定使用 JDK 25（已安装于 C:\Users\chen\.jdks\temurin-25）
org.gradle.java.home=C:/Users/chen/.jdks/temurin-25
# 国内网络加大超时，避免 fabric maven 下载超时
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Loom 下载源镜像（仅 Minecraft 客户端/服务端走本地 manifest→BMCLAPI；库依赖走 settings 里的 mavenCentral 阿里云镜像）
loom_version_manifests=file:///C:/Users/chen/Desktop/mcmeta/version_manifest.json
loom_fabric_repository=https://repository.hanbings.io/proxy/

# Fabric Properties (Minecraft 26.2, unobfuscated / Mojang official mappings)
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2

# Mod Properties
mod_version=1.0.0
maven_group=com.realcircuit
archives_base_name=realcircuit
